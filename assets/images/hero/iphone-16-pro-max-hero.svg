<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" fill="none">
  <defs>
    <radialGradient id="heroGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#DDEEFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0866F5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titanBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E6D2C1"/>
      <stop offset="45%" stop-color="#C9AF98"/>
      <stop offset="100%" stop-color="#8C735D"/>
    </linearGradient>
    <linearGradient id="frontScreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="40%" stop-color="#1E1B4B"/>
      <stop offset="75%" stop-color="#7C2D12"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="amberWave" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#102347" flood-opacity="0.28"/>
    </filter>
  </defs>
  <circle cx="320" cy="240" r="220" fill="url(#heroGlow)"/>
  <ellipse cx="320" cy="435" rx="210" ry="22" fill="#102347" fill-opacity="0.12"/>
  <!-- Back view iPhone 16 Pro Max Desert Titanium -->
  <g filter="url(#dropShadow)" transform="translate(150, 38) rotate(-4)">
    <rect x="0" y="0" width="190" height="384" rx="34" fill="url(#titanBody)" stroke="#F7EDE4" stroke-width="3"/>
    <!-- Camera plateau -->
    <rect x="14" y="14" width="96" height="98" rx="24" fill="#D5BDA8" stroke="#EFE3D8" stroke-width="2"/>
    <!-- 3 Pro Cameras -->
    <circle cx="39" cy="39" r="19" fill="#1F2937" stroke="#A68B74" stroke-width="4"/>
    <circle cx="39" cy="39" r="8" fill="#0F172A"/>
    <circle cx="39" cy="85" r="19" fill="#1F2937" stroke="#A68B74" stroke-width="4"/>
    <circle cx="39" cy="85" r="8" fill="#0F172A"/>
    <circle cx="83" cy="62" r="19" fill="#1F2937" stroke="#A68B74" stroke-width="4"/>
    <circle cx="83" cy="62" r="8" fill="#0F172A"/>
    <!-- Flash & LiDAR -->
    <circle cx="83" cy="32" r="7" fill="#FEF3C7" stroke="#D5BDA8" stroke-width="1.5"/>
    <circle cx="83" cy="92" r="8" fill="#374151"/>
    <!-- Apple-inspired minimalist geometric emblem -->
    <circle cx="95" cy="192" r="20" fill="#9E826B" fill-opacity="0.55"/>
    <path d="M98 164 C104 162 108 166 106 171 C101 172 97 169 98 164 Z" fill="#9E826B" fill-opacity="0.65"/>
  </g>
  <!-- Front view iPhone 16 Pro Max -->
  <g filter="url(#dropShadow)" transform="translate(295, 52) rotate(5)">
    <rect x="0" y="0" width="192" height="384" rx="34" fill="#111827" stroke="#C9AF98" stroke-width="4"/>
    <rect x="7" y="7" width="178" height="370" rx="28" fill="url(#frontScreen)"/>
    <path d="M7 120 Q96 60 185 170 L185 377 L7 377 Z" fill="url(#amberWave)" fill-opacity="0.72"/>
    <path d="M7 220 Q110 150 185 260 L185 377 L7 377 Z" fill="#0F172A" fill-opacity="0.82"/>
    <!-- Dynamic Island -->
    <rect x="64" y="16" width="64" height="18" rx="9" fill="#000000"/>
    <circle cx="116" cy="25" r="4" fill="#1E293B"/>
    <!-- Screen glow text -->
    <text x="96" y="102" text-anchor="middle" font-family="'Be Vietnam Pro', 'Inter', sans-serif" font-size="13" font-weight="600" fill="#FDE68A" letter-spacing="1.5">PRO TITANIUM</text>
    <text x="96" y="128" text-anchor="middle" font-family="'Be Vietnam Pro', 'Inter', sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">A18 Pro</text>
  </g>
</svg>